default: &default
  adapter: postgresql
  timeout: 5000
  username: <%= ENV.fetch("GAYFURCITY_DB_USER", "gayfurcity") %>

development:
  <<: *default
  database: <%= ENV.fetch("GAYFURCITY_DB_NAME", "gayfurcity_development") %>
  host: postgres
  pool: 5

test:
  <<: *default
  database: <%= ENV.fetch("GAYFURCITY_TEST_DB_NAME", "test") %>
  host: postgres
  pool: 5

<% if Rails.env.production? %>
production:
  <<: *default
  database: <%= ENV.fetch("GAYFURCITY_DB_NAME", "gayfurcity") %>
  password: <%= ENV.fetch("GAYFURCITY_DB_PASSWORD", "") %>
  host: <%= ENV.fetch("GAYFURCITY_DB_HOST", "postgres") %>
  port: <%= ENV.fetch("GAYFURCITY_DB_PORT", 5432) %>
  pool: <%= Sidekiq.server? ? ENV.fetch("GAYFURCITY_DB_WORKER_POOL_SIZE", 5) : ENV.fetch("GAYFURCITY_DB_POOL_SIZE", 5) %>
<% end %>
