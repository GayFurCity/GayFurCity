x-environment: &common-env
  GAYFURCITY_DOMAIN: localhost:${EXPOSED_SERVER_PORT:-4000}
  GAYFURCITY_HOSTNAME: http://localhost:${EXPOSED_SERVER_PORT:-4000}
  GAYFURCITY_CDN_DOMAIN: localhost:${EXPOSED_SERVER_PORT:-4000}
  GAYFURCITY_CDN_HOSTNAME: http://localhost:${EXPOSED_SERVER_PORT:-4000}
  GAYFURCITY_REDIS_URL: redis://redis/0
  GAYFURCITY_ELASTICSEARCH_HOST: elasticsearch
  GAYFURCITY_MEMCACHED_SERVERS: memcached
  GAYFURCITY_IQDB_SERVER: http://iqdb:5588
  GAYFURCITY_RECOMMENDER_SERVER: http://recommender:5000
  GAYFURCITY_AUTOCOMPLETED_SERVER: http://autocompleted:8118
  # Must be externally accessible
  GAYFURCITY_REPORTS_SERVER: http://localhost:${EXPOSED_SERVER_PORT:-4000}/reports
  # Must be internally accessible
  GAYFURCITY_REPORTS_SERVER_INTERNAL: http://reports:3000
  GAYFURCITY_CLICKHOUSE_URL: http://clickhouse:8123
  GAYFURCITY_REPORTS_ENABLED: 1
  GAYFURCITY_DISCORD_SITE: http://localhost:4002
  GAYFURCITY_DISCORD_SECRET: super_secret_for_url_discord
  GAYFURCITY_REPORT_KEY: super_secret_key_for_reports_signature
  # These are just development secrets, do not use them in production
  GAYFURCITY_PROTECTED_FILE_SECRET: 6686a6413d90c43d5e82403ef271ec25d13cc24e3bfcdd094e73d1eff22a3567
  GAYFURCITY_REPLACEMENT_FILE_SECRET: b35bc54cdc0d0436fc5867c7ef88f9b10a37ae20a06b37e67614fe60019d7bb1
  SECRET_TOKEN: 1c58518a891eff4520cadc59afa9e378a9325f1247544ff258096e497f095f45
  SESSION_SECRET_KEY: 44b4f44e9f253c406cbe727d403d500c1cecff943e4d2aea8f5447f28846fffe
  GAYFURCITY_REMEMBER_KEY: abc123
  GAYFURCITY_EMAIL_KEY: zDMSATq0W3hmA5p3rKTgD
  # Real values (from your Logto tenant) go in .env (gitignored), not here.
  GAYFURCITY_LOGTO_CLIENT_ID: ${GAYFURCITY_LOGTO_CLIENT_ID:-}
  GAYFURCITY_LOGTO_CLIENT_SECRET: ${GAYFURCITY_LOGTO_CLIENT_SECRET:-}
   # Hide annoying output from libvips on corrupt files
  VIPS_WARNING: "0"
  EXPOSED_WEBPACKER_PORT: ${EXPOSED_WEBPACKER_PORT:-4003}

x-depends-on: &common-depends-on
  elasticsearch:
    condition: service_healthy
  memcached:
    condition: service_healthy
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  gayfurcity: # metrics port: 9394
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    user: ${DOCKER_USER:-root}
    image: gayfurcity
    healthcheck:
      # this healthcheck is only for the rails app, the jobs process needs to be separated to be healthchecked
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:9000/up || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - post_data:/app/public/data
      - ./docker/cron_tasks/daily:/etc/periodic/daily
      - ./docker/cron_tasks/hourly:/etc/periodic/hourly
      - ./docker/logrotate.d:/etc/logrotate.d
      - ./patches:/patches
    environment:
      <<: *common-env
      RAILS_ENV: development
      GAYFURCITY_DB_USER: gayfurcity
      GAYFURCITY_DB_NAME: gayfurcity_development
      # METRICS_ENABLED (if you set it explicitly) always wins. Otherwise config/metrics.rb infers
      # it from whether COMPOSE_PROFILES contains "metrics" - forwarded through as-is since Compose
      # has no "is profile X active" interpolation to compute that here.
      METRICS_ENABLED: ${GAYFURCITY_METRICS_ENABLED:-${METRICS_ENABLED:-}}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    ports:
      - "${EXPOSED_WEBPACKER_PORT:-4003}:${EXPOSED_WEBPACKER_PORT:-4003}"
    hostname: gayfurcity.containers.local
    labels:
      - "hostname=gayfurcity.containers.local"
    depends_on:
      <<: *common-depends-on
      autocompleted:
        condition: service_healthy
      iqdb:
        condition: service_healthy
      recommender:
        condition: service_healthy
      redis:
        condition: service_healthy
      reports:
        condition: service_healthy
    tty: true
    init: true

  # For this service to work properly, it must be accessible from /tags/autocomplete.json on the same url as the primary app
  autocompleted: # metrics port: 9396
    image: ghcr.io/gayfurcity/autocompleted:084afe441b1aa0920a83a741521be550a5e38c5d
    command: /app/autocompleted
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://$$SERVER_ADDR/up || exit 1
      interval: 30s
      timeout: 2s
      retries: 5
    environment:
      SERVER_ADDR: autocompleted:8118
      PG__USER: gayfurcity
      PG__HOST: postgres
      PG__PORT: 5432
      PG__DBNAME: gayfurcity_development
      PG__POOL__MAX_SIZE: 1
      METRICS_ENABLED: ${AUTOCOMPLETED_METRICS_ENABLED:-${METRICS_ENABLED:-}}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    hostname: autocompleted.gayfurcity.containers.local
    labels:
      - "hostname=autocompleted.gayfurcity.containers.local"

  nginx:
    image: nginx:1.28.0-alpine3.21
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:$$NGINX_PORT/online || exit 1
      interval: 15s
      timeout: 2s
      retries: 5
    volumes:
      - ./public:/app/public
      - post_data:/app/public/data
      - ./docker/default.conf.template:/etc/nginx/templates/default.conf.template
    environment:
      <<: *common-env
      NGINX_PORT: ${NGINX_EXPOSED_PORT:-4000}
      # port must be present here in dev, all requests that require CSRF tokens will break
      NGINX_PROXY_HOST: ${NGINX_PROXY_HOST:-${GAYFURCITY_DOMAIN:-localhost:${EXPOSED_PROXY_PORT:-4000}}}
      NGINX_PROXY_PORT: ${NGINX_PROXY_PORT:-4000}
      NGINX_PROXY_SCHEME: ${NGINX_PROXY_SCHEME:-http}
    depends_on:
      autocompleted:
        condition: service_healthy
      gayfurcity:
        condition: service_healthy
      reports:
        condition: service_healthy
    ports:
      - "${EXPOSED_SERVER_PORT:-4000}:${NGINX_EXPOSED_PORT:-4000}"
    hostname: nginx.gayfurcity.containers.local
    labels:
      - "hostname=nginx.gayfurcity.containers.local"

  nginx-metrics: # port: 9113
    image: nginx/nginx-prometheus-exporter:1.5.1
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:${NGINX_EXPOSED_PORT:-4000}/stub_status"]
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    depends_on:
      - nginx
    profiles: [metrics]
    hostname: metrics.nginx.gayfurcity.containers.local
    labels:
      - "hostname=metrics.nginx.gayfurcity.containers.local"

  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      - POSTGRES_USER=gayfurcity
      - POSTGRES_DB=gayfurcity_development
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U gayfurcity -d postgres
      interval: 20s
      timeout: 2s
      retries: 10
    ports:
      - "${EXPOSED_POSTGRES_PORT:-34518}:5432"
    hostname: postgres.gayfurcity.containers.local
    labels:
      - "hostname=postgres.gayfurcity.containers.local"

  postgres-metrics: # port: 9187
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://gayfurcity@postgres:5432/gayfurcity_development?sslmode=disable
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    depends_on:
      - postgres
    profiles: [ metrics ]
    hostname: metrics.postgres.gayfurcity.containers.local
    labels:
      - "hostname=metrics.postgres.gayfurcity.containers.local"

  clickhouse: # metrics port: 9363
    image: clickhouse/clickhouse-server:24.8.2.3-alpine
    healthcheck:
      test: clickhouse-client --query "SELECT 1" || exit 1
      interval: 15s
      timeout: 2s
      retries: 5
    cap_add:
      - NET_ADMIN
      - IPC_LOCK
      - SYS_NICE
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./config/clickhouse.xml:/etc/clickhouse-server/config.d/z_clickhouse.xml
      # no env variable support
      #- ./config/clickhouse.metrics.xml:/etc/clickhouse-server/config.d/z_clickhouse.metrics.xml
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "${EXPOSED_CLICKHOUSE_PORT:-34520}:8123"
    hostname: clickhouse.gayfurcity.containers.local
    labels:
      - "hostname=clickhouse.gayfurcity.containers.local"

  redis:
    image: redis:8.0.1-alpine3.21
    command: redis-server --save 10 1 --loglevel warning
    healthcheck:
      test: redis-cli ping
      interval: 15s
      timeout: 2s
      retries: 5
    volumes:
      - redis_data:/data
    ports:
      - "${EXPOSED_REDIS_PORT:-34519}:6379"
    hostname: redis.gayfurcity.containers.local
    labels:
      - "hostname=redis.gayfurcity.containers.local"

  redis-metrics: # port: 9121
    image: oliver006/redis_exporter:v1.86.0-alpine
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    depends_on:
      - redis
    profiles: [ metrics ]
    hostname: metrics.redis.gayfurcity.containers.local
    labels:
      - "hostname=metrics.redis.gayfurcity.containers.local"

  memcached:
    image: memcached:1.6.38-alpine
    healthcheck:
      test: echo "version" | nc -vn -w 1 127.0.0.1 11211
      interval: 30s
      timeout: 2s
      retries: 5
    hostname: memcached.gayfurcity.containers.local
    labels:
      - "hostname=memcached.gayfurcity.containers.local"

  memcached-metrics: # port: 9150
    image: quay.io/prometheus/memcached-exporter:v0.16.0
    restart: unless-stopped
    command: ["--memcached.address=memcached:11211"]
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    depends_on:
      - memcached
    profiles: [ metrics ]
    hostname: metrics.memcached.gayfurcity.containers.local
    labels:
      - "hostname=metrics.memcached.gayfurcity.containers.local"

  elasticsearch:
    build:
      context: docker/elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - logger.level=WARN
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - TINI_SUBREAPER=true
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    init: true
    healthcheck:
      test: curl "elasticsearch:9200/_cluster/health?wait_for_status=yellow&timeout=2s"
      interval: 30s
      timeout: 2s
      retries: 12
    ports:
      - "${EXPOSED_ELASTICSEARCH_PORT:-49200}:9200"
    hostname: elasticsearch.gayfurcity.containers.local
    labels:
      - "hostname=elasticsearch.gayfurcity.containers.local"

  elasticsearch-metrics: # port: 9114
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.10.0
    restart: unless-stopped
    command: ["--es.uri=http://elasticsearch:9200", "--es.all", "--es.indices"]
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    depends_on:
      - elasticsearch
    profiles: [ metrics ]
    hostname: metrics.elasticsearch.gayfurcity.containers.local
    labels:
      - "hostname=metrics.elasticsearch.gayfurcity.containers.local"

  iqdb: # metrics port: 5588
    image: ghcr.io/gayfurcity/iqdb:304e595af4388f7b5bdbf20a001e45035564d22f
    command: iqdb http 0.0.0.0 5588 /iqdb/iqdb.db
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:5588/status || exit 1
      interval: 30s
      timeout: 2s
      retries: 5
    volumes:
      - iqdb_data:/iqdb
    environment:
      METRICS_ENABLED: ${IQDB_METRICS_ENABLED:-${METRICS_ENABLED:-}}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    hostname: iqdb.gayfurcity.containers.local
    labels:
      - "hostname=oqdb.gayfurcity.containers.local"

  recommender: # metrics port: 5000
    image: ghcr.io/gayfurcity/recommender:2cd2a0c6970c41bf0c1dda9e5485a1c71c498207
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/info || exit 1
      interval: 30s
      timeout: 2s
      retries: 5
    volumes:
      - recommender_data:/recommender/data
    environment:
      DATABASE_URL: postgres://gayfurcity:@postgres/gayfurcity_development
      OPENBLAS_NUM_THREADS: 1
      TRAINING_THREADS: 4
      METRICS_ENABLED: ${RECOMMENDER_METRICS_ENABLED:-${METRICS_ENABLED:-}}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    hostname: recommender.gayfurcity.containers.local
    labels:
      - "hostname=recommender.gayfurcity.containers.local"

  # By default, this is bound to /reports on the same url as the primary app for external access
  # To change this, set the GAYFURCITY_REPORTS_SERVER env variable
  # For internal access, change the GAYFURCITY_REPORTS_SERVER_INTERNAL env varable (defaults to http://reports:3000)
  reports: # metrics port: 9100
    image: ghcr.io/gayfurcity/reports:4c17c3954c98575bdeaf9a79477a2d63f3361d88
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/up || exit 1
      interval: 30s
      timeout: 2s
      retries: 5
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_URL: redis://redis/1
      SECRET_KEY: ${GAYFURCITY_REPORT_KEY:-super_secret_key_for_reports_signature}
      METRICS_ENABLED: ${REPORTS_METRICS_ENABLED:-${METRICS_ENABLED:-}}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    ports:
      - "${EXPOSED_REPORTS_PORT:-4001}:3000"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    hostname: reports.gayfurcity.containers.local
    labels:
      - "hostname=reports.gayfurcity.containers.local"

  # Discord integration

  discordbot:
    image: ghcr.io/gayfurcity/discordbot:d5c3b2899ac4e9e96536e2079568133c91682f4c
    environment:
      DISCORD_TOKEN: ${DISCORDBOT_DISCORD_TOKEN-}
      DISCORD_ID: ${DISCORDBOT_DISCORD_ID-}
      DISCORD_SECRET: ${DISCORDBOT_DISCORD_SECRET-}
      REDIS_URL: ${DISCORDBOT_REDIS_URL:-redis://redis/2}
      REDIS_CHANNELS_TICKETS: ${DISCORDBOT_CHANNELS_TICKETS:-ticket_updates}
      GUILD_ID: ${DISCORDBOT_GUILD_ID-}
      ADMIN_ROLE: ${DISCORDBOT_ADMIN_ROLE-}
      JOINER_PORT: ${JOINER_PORT:-4002}
      JOINER_URL: ${DISCORDBOT_JOINER_URL:-http://localhost:${EXPOSED_JOINER_PORT:-4002}}
      JOINER_SECRET: ${GAYFURCITY_DISCORD_SECRET:-super_secret_for_url_discord}
      JOINER_CHANNEL_ID: ${DISCORDBOT_JOINER_CHANNEL_ID-}
      AUDIT_LOG_CHANNEL_ID: ${DISCORDBOT_AUDIT_LOG_CHANNEL_ID-}
      EVENT_CHANNEL_ID: ${DISCORDBOT_EVENT_CHANNEL_ID-}
      TICKET_CHANNEL_ID: ${DISCORDBOT_TICKET_CHANNEL_ID-}
      MEMBER_ROLE_ID: ${DISCORDBOT_MEMBER_ROLE_ID-}
      BASE_URL: ${DISCORDBOT_BASE_URL:-http://localhost:${EXPOSED_SERVER_PORT:-4000}}
      FETCH_URL: ${DISCORDBOT_FETCH_URL:-http://nginx:${EXPOSED_SERVER_PORT:-4000}}
      CDN_HOST: ${DISCORDBOT_CDN_HOST:-localhost:${EXPOSED_SERVER_PORT:-4000}}
      BLACKLISTED_TAGS: ${DISCORDBOT_BLACKLISTED_TAGS:-}
      STAFF_CATEGORIES: ${DISCORDBOT_STAFF_CATEGORIES:-}
      SAFE_CHANNELS: ${DISCORDBOT_SAFE_CHANNELS:-}
      ENCRYPTION_KEY: ${DISCORDBOT_ENCRYPTION_KEY:-o7SrC4IZKDeX4WOC4Zulp2xhQxNM1tvkHmi4Wh8AEqbjdCR3vFQplQCPE6FlnisLCLbs3Axeg0B96hYr}
      ENCRYPTION_SALT: ${DISCORDBOT_ENCRYPTION_SALT:-apPyQsjNgUOIiAV62Evly0qgJATdocWwKT0vsdow}
    init: true
    ports:
      - "${EXPOSED_JOINER_PORT:-${JOINER_PORT-}}:${JOINER_PORT:-4002}"
    profiles:
      - discord

  # Useful for development

  tests:
    image: gayfurcity
    environment:
      <<: *common-env
      RAILS_ENV: test
    volumes:
      - .:/app
      - ./docker/local_config.rb:/app/config/local_config.rb
      - node_modules:/app/node_modules
    depends_on:
      <<: *common-depends-on
    entrypoint: bundle exec rails test
    profiles:
      - tests

  dtext:
    build:
      context: lib/dtext_rb
    image: dtext
    profiles:
      - tests

  rubocop:
    image: gayfurcity
    volumes:
      - .:/app
      - rubocop_cache:/rubocop_cache
    entrypoint: bundle exec rubocop --cache-root /rubocop_cache
    profiles:
      - rubocop

  linter:
    image: gayfurcity
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    entrypoint: yarn run lint
    profiles:
      - linter

volumes:
  post_data:
  iqdb_data:
  elasticsearch_data:
  db_data:
  redis_data:
  node_modules:
  rubocop_cache:
  recommender_data:
  clickhouse_data:

networks:
  default:
    driver: bridge
    ipam:
      driver: default
    driver_opts:
      com.docker.network.bridge.name: br-gayfurcity
