name: Checks

on:
  push:
    branches:
      # master is covered by build.yml, which calls this workflow itself (workflow_call below) -
      # triggering here too would run every job twice on every push to master.
      - dev
      - build-*
  pull_request:
    branches:
      - master
      - dev
      - build-*
  workflow_call:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build GayFurCity Image
        uses: docker/build-push-action@v4
        with:
          platforms: linux/amd64
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64
          build-args: GIT_COMMIT=${{ github.sha }}
          load: true
          tags: gayfurcity
          outputs: type=docker,dest=/tmp/gayfurcity.tar

      - name: Upload GayFurCity Image
        uses: actions/upload-artifact@v4
        with:
          name: gayfurcity
          path: /tmp/gayfurcity.tar

      - name: Build DText Image
        uses: docker/build-push-action@v4
        with:
          context: "{{defaultContext}}:lib/dtext_rb"
          cache-from: type=gha
          load: true
          tags: dtext
          outputs: type=docker,dest=/tmp/dtext.tar


      - name: Upload DText Image
        uses: actions/upload-artifact@v4
        with:
          name: dtext
          path: /tmp/dtext.tar

  rubocop:
    runs-on: ubuntu-22.04
    needs: docker-build
    if: ${{ !contains(github.event.head_commit.message, '[skip rubocop]') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Load GayFurCity Image
        uses: ./.github/load-docker-image
        with:
          name: gayfurcity

      - name: Run Rubocop
        run: $DOCKER_RUN rubocop --format github

  eslint:
    runs-on: ubuntu-22.04
    needs: docker-build
    if: ${{ !contains(github.event.head_commit.message, '[skip lint]') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Load GayFurCity Image
        uses: ./.github/load-docker-image
        with:
          name: gayfurcity

      - name: Run ESLint
        run: $DOCKER_RUN linter

  tests:
    runs-on: ubuntu-22.04
    needs: docker-build
    if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Load GayFurCity Image
        uses: ./.github/load-docker-image
        with:
          name: gayfurcity

      - name: Run Tests
        run: $DOCKER_RUN -e PARALLEL_WORKERS=4 tests

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: log/test.log

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Minitest Results
          path: 'test/reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: GayFurCity/GayFurCity

  dtext-tests:
    runs-on: ubuntu-22.04
    needs: docker-build
    if: ${{ !contains(github.event.head_commit.message, '[skip dtext]') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Load DText Image
        uses: ./.github/load-docker-image
        with:
          name: dtext

      - name: Run Tests
        run: $DOCKER_RUN dtext bin/rake test
