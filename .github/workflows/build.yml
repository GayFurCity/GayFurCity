name: Build

on:
  push:
    branches:
      - master
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      skip_checks:
        description: "Skip checks and publish immediately"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  checks:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_checks) }}
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      checks: write
  build:
    # needs.checks.result is 'skipped' (not 'success') when skip_checks was used above - both
    # count as "go ahead", only an actual check failure should block publishing.
    if: always() && github.repository_owner == 'gayfurcity' && (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    needs: [checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      # ghcr.io (like all Docker registries) requires lowercase repository paths; github.repository
      # preserves the org/repo's actual casing (GayFurCity/GayFurCity), which fails at push time.
      - name: Compute lowercase image repository
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Generate Docker labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
          flavor: |
            latest=true
      - run: cat docker/prod/.dockerignore .gitignore | tee .dockerignore
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ steps.repo.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          platform=${{ matrix.platform }}
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.repository_owner == 'gayfurcity'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      # ghcr.io (like all Docker registries) requires lowercase repository paths; github.repository
      # preserves the org/repo's actual casing (GayFurCity/GayFurCity), which fails at push time.
      - name: Compute lowercase image repository
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Generate Docker tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
          flavor: |
            latest=true

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ steps.repo.outputs.name }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.metadata.outputs.version }}
